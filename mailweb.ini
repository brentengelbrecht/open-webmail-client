# mailweb.ini - configuration for run.py. Keep it beside run.py (or use --config).
#
# Comments go on their own line (an inline "#" would become part of the value).
# Option lines must start in column 1. Unknown sections/options stop startup.
# Relative paths resolve against THIS file's folder; "~" is expanded.
# Every option is shown with its default; REQUIRED ones have none.
#
# Mail accounts are NOT configured here: add them in the web UI (the "+" in the left gutter).

[web]
# Address/port the web UI listens on. 127.0.0.1 = this machine only;
# use 0.0.0.0 to reach it from other devices on your LAN (enable TLS then).
host = 127.0.0.1
port = 8080
# How long a sign-in lasts, in minutes, counted from sign-in (not from last activity).
# After that the browser returns to the sign-in screen. 60 = 1 hour; maximum 10080 (7 days).
session_minutes = 60
# Optional HTTPS (PEM files). Set both, or neither.
cert = 
key = 
# Login password for this web UI. Order: MAILWEB_WEB_PASSWORD env var,
# password_file, password. REQUIRED (one of the three).
password_file =
password =
# Where accounts added in the UI are stored. The whole file is encrypted (key derived from the
# web password above, salted scrypt) and created chmod 600. If you change the web password the
# file can no longer be opened: restore the old password, or delete the file and re-add accounts.
# Needs the 'cryptography' package (see requirements.txt).
accounts_file = accounts.json

[mail]
# Messages per page.
page_size = 50
# Parsed messages kept in memory.
message_cache = 32
# Seconds before a folder's message index / folder list is re-read.
# The "refresh" button in the UI forces it.
index_ttl_seconds = 600
# Seconds to wait on an IMAP server.
imap_timeout = 30
# Connections kept per account, so that a slow request (loading the folder list, a big search)
# does not hold up the others. Gmail allows 15 per account in total; 1-8.
imap_connections = 3
# Seconds to wait for a SEARCH to finish. Text searches over a big folder can legitimately take minutes
# (some servers read and parse every message), so this is much longer than imap_timeout. You can stop one
# at any time with the X in the search box.
imap_search_timeout = 600
# true = show remote images in every message of every account without asking.
# false = blocked until you click "Download images" in a message. Remote images can
# tell the sender that, when and from where you opened the message, so false is safer.
load_remote_images = false

[logging]
# DEBUG, INFO, WARNING or ERROR.
level = INFO
# Log to this file instead of the terminal.
file =
